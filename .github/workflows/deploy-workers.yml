# Workers de Cloudflare (worker/ y support-worker/).
# - En cada PR que los toque: build de prueba (wrangler deploy --dry-run) y comprobacion de
#   que el token y la cuenta son validos (wrangler whoami). No despliega nada.
# - Al cambiar en main (o a mano desde Actions): despliegue real.
# Necesita el secreto CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers") y la
# variable CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions.
name: Deploy Workers

on:
  push:
    branches: [main]
    paths: ['worker/**', 'support-worker/**', '.github/workflows/deploy-workers.yml']
  pull_request:
    paths: ['worker/**', 'support-worker/**', '.github/workflows/deploy-workers.yml']
  workflow_dispatch:

env:
  WRANGLER_VERSION: '4.147.0'

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:worker
      - name: Build de prueba de los dos Workers
        run: |
          for d in worker support-worker; do
            (cd "$d" && npx -y "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir "$RUNNER_TEMP/$d")
          done
      - name: Comprobar el token y la cuenta de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y "wrangler@$WRANGLER_VERSION" whoami

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        dir: [worker, support-worker]
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; no se despliega ${{ matrix.dir }}."
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm run test:worker
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: ${{ matrix.dir }}
