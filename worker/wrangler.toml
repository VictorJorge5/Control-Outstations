# Worker de acceso y datos (login, /api/data, F-CAMO, seguimiento, usuarios).
# Desplegar:  cd worker && npx wrangler deploy
name = "control-estaciones-auth"
main = "src/index.js"
# Revisa en el panel de Cloudflare (Worker > Settings > Runtime) la fecha que tiene hoy y ponla aqui
compatibility_date = "2026-09-16"

# APP_URL, FROM_EMAIL y los secretos (AUTH_SECRET, SENDGRID_API_KEY) se gestionan en el
# panel; keep_vars evita que un deploy los borre. Los origenes CORS se versionan aqui.
keep_vars = true

[vars]
# GitHub Pages (version anterior, mientras dure la migracion) y Vercel (produccion)
ALLOWED_ORIGIN = "https://victorjorge5.github.io,https://control-outstations.vercel.app"
# previews de Vercel de cada rama/PR de este proyecto
ALLOWED_ORIGIN_PATTERN = '^https://control-outstations-[a-z0-9-]+-victorjorge5s-projects\.vercel\.app$'

[[d1_databases]]
binding = "DB"
database_name = "control-estaciones-auth"
database_id = "34db18df-d418-4169-969d-e80130249bd6"
